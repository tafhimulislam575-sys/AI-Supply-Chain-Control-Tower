<!DOCTYPE html>
<html>

<head>
    <title>Supply Chain Control Tower</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h1>AI Supply Chain Control Tower</h1>

<div class="dashboard">

    <div class="card">
        <h3>Suppliers</h3>
        <h2 id="suppliers">0</h2>
    </div>

    <div class="card">
        <h3>Orders</h3>
        <h2 id="orders">0</h2>
    </div>

    <div class="card">
        <h3>Delivery %</h3>
        <h2 id="delivery">0</h2>
    </div>

</div>

<br>

<canvas id="riskChart"></canvas>

<script src="script.js"></script>

</body>
</html>
